networks:
  nginx-proxy:
    external: true


services:
  apache2:
    build: .
    container_name: apache2
    environment:
      - VIRTUAL_HOST=host1.omniware.it
      - VIRTUAL_PORT=80
    volumes:
      - "./data/site:/var/www/html:ro"
    tty: true
    command: /usr/sbin/apache2ctl -D FOREGROUND
    networks:
      - nginx-proxy


  apache2-backup:
    build: .
    container_name: apache2-backup
    environment:
      - VIRTUAL_HOST=host1.omniware.it
      - VIRTUAL_PORT=80
    ports:
      - 8080:80
    volumes:
      - "./data/site:/var/www/html:ro"
    tty: true
    command: /usr/sbin/apache2ctl -D FOREGROUND
    networks:
      - nginx-proxy


  nginx-proxy:
    image: nginxproxy/nginx-proxy:1.11
    container_name: proxy
    ports:
      - 80:80
      - 443:443
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ./data/nginx/conf:/etc/nginx/conf.d
      - ./data/nginx/vhost:/etc/nginx/vhost.d
      - ./data/nginx/certs:/etc/nginx/certs
      - ./data/nginx/dhparam:/etc/nginx/dhparam
      - ./data/site:/usr/share/nginx/html
      - ./data/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - nginx-proxy


  dns:
    build: ./dns
    container_name: dns
    ports:
      - "10.10.14.79:53:53/tcp"
      - "10.10.14.79:53:53/udp"
    volumes:
      - ./data/bind/named.conf.local:/etc/bind/named.conf.local
      - ./data/bind/named.conf.options:/etc/bind/named.conf.options
      - ./data/bind/zones/masters/db.omniware.it:/etc/bind/zones/masters/db.omniware.it
    networks:
      - nginx-proxy
    restart: always


  database:
    image: mariadb:11.4
    container_name: database
    expose:
      - 3306
    environment:
      - MARIADB_ROOT_PASSWORD=Maria
      - MARIADB_DATABASE=catalogo
    volumes:
      - ./data/mariadb:/var/lib/mysql
    networks:
      - nginx-proxy
    restart: always


  phpmyadmin:
    image: phpmyadmin:5.2.3-apache
    container_name: phpmyadmin
    ports:
      - 81:80
    environment:
      PMA_HOST: database
    networks:
      - nginx-proxy